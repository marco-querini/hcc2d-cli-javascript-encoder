name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish package
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: marco-querini/hcc2d-cli-c-encoder
          ref: 92d205bc47abab7c2dc80b3b20288870840550d1 # v0.9.0
          path: references/c
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: marco-querini/hcc2d-cli-python-encoder
          ref: 4f6cd78fb513505a0d0a412834f5b04487884f57 # v0.9.0
          path: references/python
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm test
      - run: npm run test:reference
        env:
          HCC2D_C_REFERENCE_DIR: ${{ github.workspace }}/references/c
          HCC2D_PYTHON_REFERENCE_DIR: ${{ github.workspace }}/references/python
      - run: npm pack --dry-run
      - name: Publish package
        run: npm publish --access public --provenance --tag "${{ github.event.release.prerelease && 'next' || 'latest' }}"
