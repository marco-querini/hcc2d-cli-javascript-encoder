name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: marco-querini/hcc2d-cli-c-encoder
          path: references/c
      - uses: actions/checkout@v6
        with:
          repository: marco-querini/hcc2d-cli-python-encoder
          path: references/python
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run test:reference
        env:
          HCC2D_C_REFERENCE_DIR: ${{ github.workspace }}/references/c
          HCC2D_PYTHON_REFERENCE_DIR: ${{ github.workspace }}/references/python
      - run: npm pack --dry-run
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
