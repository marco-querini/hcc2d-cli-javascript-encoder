name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  package:
    name: Validate npm package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm pack --dry-run
      - run: npm pack
      - run: |
          mkdir package-smoke
          cd package-smoke
          npm init -y
          npm install ../hcc2d-encoder-0.9.0.tgz
          ./node_modules/.bin/hcc2d-encoder --text "package smoke test" --mode hcc2d4 --file-format raw output.png
          test -s output.png

  reference-parity:
    name: C/Python parity (800 cases)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: marco-querini/hcc2d-cli-c-encoder
          path: references/c
      - uses: actions/checkout@v6
        with:
          repository: marco-querini/hcc2d-cli-python-encoder
          path: references/python
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: npm ci
      - run: npm run test:reference
        env:
          HCC2D_C_REFERENCE_DIR: ${{ github.workspace }}/references/c
          HCC2D_PYTHON_REFERENCE_DIR: ${{ github.workspace }}/references/python
